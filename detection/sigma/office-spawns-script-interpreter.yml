title: Office Application Spawning a Script Interpreter
id: d0cf3fd6-7970-497d-b248-8715345c9a0a
status: experimental
description: >
  Detects an Office application starting a command or script interpreter. Typical of a
  malicious attachment executing a macro or a dropper after a phishing email.
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1059/
author: Omar Babba
date: 2026/10/09
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate macros or add-ins that launch a script (inventory and allowlist them)
level: high
