title: Rclone Execution on a Windows Host
id: 3aa880d5-a5fa-474c-8275-80ee1a8cc331
status: experimental
description: >
  Detects execution of rclone, a legitimate sync tool frequently used to copy data to cloud
  storage during exfiltration before extortion.
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: Omar Babba
date: 2026/10/09
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\rclone.exe'
  selection_original:
    OriginalFileName: 'rclone.exe'
  condition: 1 of selection_*
falsepositives:
  - Approved use of rclone by IT or backup teams (allowlist by host and user)
level: medium
